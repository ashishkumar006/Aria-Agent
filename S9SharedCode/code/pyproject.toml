[project]
name = "eagv3-s9"
version = "0.1.0"
description = "EAGV3 Session 9 agent: growing-graph orchestrator (planner/skills/formatter) + Browser skill + gated computer-use + Tier-1 integrations (Gmail/GitHub/Slack/Notion/Telegram) over the V9 LLM gateway."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "httpx",
    "ddgs",
    "tavily-python",
    "crawl4ai",
    "python-dotenv",
    "pydantic>=2.13.4",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    "networkx>=3.2",
    "pyyaml>=6.0",
    # Session 9 additions for the Browser skill.
    "playwright>=1.47",
    "pillow>=10.0",
    "trafilatura>=1.12",
    "lxml>=5.2",
    "lxml-html-clean>=0.1",
    # General-agent web UI (agent_server.py + web/).
    # NOTE: voice models (kokoro-onnx/soundfile/faster-whisper) live on the
    # gateway now (/v1/tts, /v1/stt) — the agent proxies, so they are NOT
    # agent deps anymore.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "cua-driver>=0.19.3",
    "apscheduler>=3.11.3",
    "prefab-cloud-python>=0.12.1",
    "prefab-ui",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "network: test requires internet access",
    "embed: test requires the embedding endpoint (gateway V8)",
]
