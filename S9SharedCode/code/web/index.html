<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aria — General AI Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">◆</div>
        <div class="brand-text">
          <h1>Aria</h1>
          <p>General AI Agent · voice-enabled</p>
        </div>
      </div>
      <div class="status" id="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">connecting…</span>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <section id="cuPanel" class="cu-panel" hidden>
      <div class="cu-head">
        <h2>Computer-use approvals</h2>
        <span class="cu-cap" id="cuCap"></span>
      </div>
      <ul id="cuList" class="cu-list"></ul>
    </section>

    <section id="replayPanel" class="replay-panel" hidden>
      <div class="replay-head">
        <h2>Computer-use replay</h2>
        <button type="button" id="replayRefresh" class="icon-btn" title="Refresh">⟳</button>
      </div>
      <ul id="replayList" class="replay-list"></ul>
      <div id="replayDetail" class="replay-detail" hidden></div>
    </section>

    <div class="composer-wrap">
      <div class="suggestions" id="suggestions">
        <button type="button" class="chip" data-q="Read my latest 3 emails and tell me the sender and subject.">📧 Read my emails</button>
        <button type="button" class="chip" data-q="List my GitHub repositories.">🐙 List my repos</button>
        <button type="button" class="chip" data-q="What's the weather in London?">🌤️ Weather</button>
        <button type="button" class="chip" data-q="Summarise the benefits of vector databases for RAG.">🧠 Research topic</button>
        <button type="button" class="chip" data-q="Open Spotify and play something.">🎵 Play music</button>
      </div>
      <form id="composer" class="composer">
        <button type="button" id="mic" class="icon-btn" title="Voice input" aria-label="Voice input">🎤</button>
        <textarea id="input" rows="1" placeholder="Type or speak your question…" autocomplete="off"></textarea>
        <button type="button" id="stop" class="icon-btn stop-btn" title="Stop" aria-label="Stop" hidden>■</button>
        <button type="submit" id="send" class="send-btn" title="Send" aria-label="Send">➤</button>
      </form>
      <div class="toolbar">
        <label class="switch">
          <input type="checkbox" id="tts" />
          <span>🔊 Speak responses</span>
        </label>
        <span class="hint" id="voiceHint"></span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
