<html lang="en">
<head>

<title>Aria · Memory</title>
<link rel="stylesheet" href="/console.css">
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<aside class="rail">
  <div class="rail-brand"><span class="bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></span><span class="lbl">Aria</span></div>
  <div class="rail-group">Core</div>
  <a href="/console" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span class="lbl">Chat</span></a>
  <a href="/runs" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4V8z"/></svg></span><span class="lbl">Runs</span></a>
  <a href="/memory" class="rail-item active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg></span><span class="lbl">Memory</span></a>
  <a href="/research" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><span class="lbl">Research</span></a>
  <div class="rail-group">Automate</div>
  <a href="/scheduler" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span class="lbl">Scheduler</span></a>
  <a href="/skills" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span><span class="lbl">Skills</span></a>
  <div class="rail-group">Insight</div>
  <a href="/apps" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="lbl">Apps</span></a>
  <a href="/ledger" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 14l4-4 3 3 5-6"/></svg></span><span class="lbl">Ledger</span></a>
  <a href="/mission" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6M12 19h8"/></svg></span><span class="lbl">Console</span></a>
  <div class="rail-group">System</div>
  <a href="/settings" class="rail-item"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 6h-7M10 6H3M21 12h-9M8 12H3M21 18h-5M12 18H3"/><circle cx="12" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg></span><span class="lbl">Settings</span></a>
  <div class="rail-foot"><span id="health-dot" class="dot r"></span><span class="txt" id="health-text">connecting…</span></div>
</aside>
<div class="ctx">
  <div class="ctx-head"><span>Drawers</span><span id="drawer-count" class="badge">—</span></div>
  <div class="ctx-list" id="drawers"></div>
  <div class="props">
    <div class="ph"><span>Store</span></div>
    <div class="k">SHOWN</div><div class="val plain" id="p-shown">—</div>
    <div class="k">DRAWER</div><div class="val" id="p-drawer">all</div>
  </div>
</div>
<div class="page">
  <div class="topbar">
    <div class="crumb">✦ Aria <span class="sep">/</span> <span class="dim">Memory</span></div>
    <input type="text" id="mem-search" placeholder="Search memory…" autocomplete="off">
    <div class="spacer"></div>
    <label class="hint"><input type="checkbox" id="mem-hide" checked style="accent-color:var(--accent)"> hide superseded</label>
    <button onclick="loadMem()">Search</button>
  </div>
  <main class="canvas" id="canvas">
    <section class="dag" id="write-panel">
      <div class="dag-head"><span>REMEMBER</span><span class="spacer" style="flex:1"></span><button onclick="toggleWrite()">hide</button></div>
      <div id="write-body" style="padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
        <label class="hint">kind<br><select id="w-kind" style="background:var(--inset);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-size:12px;">
          <option>fact</option><option>preference</option><option>tool_outcome</option><option>scratchpad</option>
        </select></label>
        <label class="hint" style="flex:1;min-width:220px;">descriptor<br><input type="text" id="w-desc" placeholder="one short human-readable line" style="width:100%;background:var(--inset);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:5px;font-size:12px;"></label>
        <label class="hint">keywords (comma)<br><input type="text" id="w-kw" placeholder="a, b" style="width:150px;background:var(--inset);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:5px;font-size:12px;"></label>
        <button onclick="remember()">Remember</button>
        <label class="hint">wipe session<br><span style="display:flex;gap:6px;"><input type="text" id="w-sess" placeholder="session id" style="width:130px;background:var(--inset);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:5px;font-size:12px;"><button onclick="wipeSession()">Wipe</button></span></label>
      </div>
      <div id="write-out" class="hint" style="padding:0 12px 8px;"></div>
    </section>
    <div id="chunks"></div>
  </main>
  <footer><a href="/console">chat</a> · gateway memory at <a href="http://localhost:8109/static/system.html">system</a></footer>
</div>
<script src="/memory.js"></script>
</body>
</html>
