# Session 9 skills catalogue (grown from the Session 8 set).
#
# Each entry below names one skill (the node "type" the orchestrator can
# run). The two files that define a skill are this yaml entry and the
# referenced `prompt:` markdown — there is no Python class per skill.
#
# Fields:
#   prompt              path to the system prompt, relative to S9SharedCode/code/
#   description         one-line summary (shown in dashboards / replay)
#   provider_pin        OPTIONAL preferred provider; overridden by
#                       agent_routing.yaml in the gateway if set there.
#                       Most pins live in the gateway side, not here.
#   tools_allowed       which MCP tools this skill may call. Empty list
#                       means the skill is text-only and never calls a
#                       tool through the gateway's tool-use channel.
#   internal_successors STATIC graph extension. Whenever this skill
#                       finishes, the orchestrator adds these skills as
#                       successor nodes regardless of what the skill
#                       itself emitted in AgentResult.successors. Used
#                       by Coder → SandboxExecutor.
#   critic              When true, the orchestrator inserts a Critic
#                       node on every outgoing edge from this skill.
#                       Used by Distiller.
#
# Anything declared under `metadata:` is opaque to the orchestrator; the
# skill is free to interpret its own metadata however it wants.

planner:
  prompt: prompts/planner.md
  tools_allowed: []
  temperature: 0.4         # decompositions need a little breathing room
  # A plan carries the facet list, per-worker questions and goals, plus the
  # recovery subgraphs. 1500 truncated a broad plan mid-JSON (which the
  # parser then rejected outright, losing the whole decomposition).
  # The facet count is the research budget: 4 facets produced 17.7k chars of
  # findings, 3 produced 13.4k, and the author inherited that difference as a
  # document that either had substance or read as a stub.
  max_tokens: 65536
  description: Decomposes user queries into the initial DAG and synthesises recovery subgraphs on node failure.

retriever:
  prompt: prompts/retriever.md
  # recall_preferences to answer "how do I like things?" (a standing
  # preference must beat a lexical match on topic words), and
  # remember_preference because a correction often arrives mid-retrieval
  # ("no, I always want the publication date") and that turn is the only
  # place it was said out loud.
  tools_allowed: [search_knowledge, recall_preferences, remember_preference]
  temperature: 0.2         # retrieval is mostly deterministic
  # Chunk previews are the raw material the Formatter expands on, so this
  # must hold enough of them to answer from.
  # Raised to the provider ceiling: the retriever selects what every
  # downstream node reads first, so a narrow cap silently bounds the whole
  # research base before the researchers ever run.
  max_tokens: 65536
  description: Searches Memory and the FAISS index for material relevant to a query.

researcher:
  prompt: prompts/researcher.md
  # remember_preference: a research run is where "always give me the
  # publication date" and "no paywalled sources" get said out loud. Without a
  # write path here, preferences said during research were lost.
  # verify_citations: REMOVED from this skill. The tool still exists in the
  # catalog (other skills may use it), but requiring it here meant the
  # researcher emitted a per-claim quote/source table before it could write
  # anything, and that table cost a measured 77% of the findings: the same
  # model on the same topic produced 1,118 words of prose against 255 words
  # through the claim/quote/source schema. It also spent 18 of 125 tool calls
  # in one run verifying quotes that a Sources section at the end of the
  # document serves just as well.
  # read_artifact: a sibling's findings spill to a handle when
  # they are long, and a spilled result is unreadable without this.
  tools_allowed: [web_search, fetch_url, arxiv_search, wikipedia_search,
                  openalex_search, news_search, fetch_pdf, extract_tables,
                  wayback_fetch, remember_preference, recall_preferences,
                  read_artifact]
  temperature: 0.7         # exploratory; let the model choose phrasings
  # `findings` is what every downstream node reads, and this was the single
  # tightest constraint in the whole DAG: 6000 tokens had to cover the
  # findings PLUS up to 12 evidence entries each carrying a verbatim quote,
  # plus conflicts and caveats. Downstream, the INPUTS block allows 400k
  # chars — roughly 5x what the researcher could emit, so the budget sat
  # unused while the producer ran out of room.
  #
  # 65536 is the provider's own accepted maxOutputTokens, verified live
  # (6000 / 16384 / 24576 / 32768 / 65536 all accepted, stop_reason
  # end_turn). Not an arbitrary "make it big": it is the ceiling, so the
  # model writes until it is done rather than until a local constant runs out.
  # Cost scales with what is actually written, not with the ceiling.
  max_tokens: 65536
  description: Performs multi-step web research and produces normalised text outputs.

distiller:
  prompt: prompts/distiller.md
  critic: true
  temperature: 0.1         # extraction; almost-zero
  # One field per item, verbatim evidence lines: a 12-row comparison ran
  # past 1200 and lost its tail rows (and the Critic then failed the
  # truncation it was meant to catch). Raised to match the researcher: the
  # Distiller re-emits the researcher's findings, so a cap here discards the
  # very text the higher researcher budget just paid to produce.
  max_tokens: 65536
  # Large upstream results arrive in INPUTS as an artifact handle + preview;
  # this is how a node expands one when the detail matters.
  tools_allowed: [read_artifact]
  description: Extracts structured fields from raw text or page content.

summariser:
  prompt: prompts/summariser.md
  temperature: 0.3
  # The Summariser is UPSTREAM of the Formatter, so it is a ceiling on the
  # final answer, not a courtesy: anything it drops cannot be written up.
  # Its job is to drop redundancy and page chrome, not facts. 1200 capped
  # the whole downstream report at ~900 words.
  # Raised to the provider ceiling: the Distiller emits one field per row
  # with a verbatim evidence line each, so a narrow cap truncates the tail
  # rows and the Critic then cannot see the truncation it exists to catch.
  max_tokens: 65536
  tools_allowed: [read_artifact]
  description: Condenses long content into a short form.

critic:
  prompt: prompts/critic.md
  temperature: 0.0         # pass/fail; we want determinism
  max_tokens: 500
  # The Critic is auto-inserted on every outgoing edge of a `critic: true`
  # skill and is handed that node's output verbatim. It had NO tools, so the
  # moment the INPUTS spill started working (it never had — the spill loop
  # never looked inside an upstream node's `output` dict) it would have
  # passed or failed a node on 1,500 characters of preview with no way to
  # fetch the rest, and its rejection would send the run into a replan loop
  # for a reason that was invisible.
  tools_allowed: [read_artifact]
  description: Evaluates an upstream node's output; emits pass or fail with rationale.

# ── document authoring ──────────────────────────────────────────────────────
# The user asks for a FILE ("write me a report", "build a deck", "export a
# spreadsheet"). These two skills write the content as structured blocks and
# call `render_document`, which renders a real PDF/PPTX/DOCX/XLSX through the
# gateway (reportlab / python-pptx / python-docx / openpyxl) and returns an
# artifact handle the console offers as a download.
author:
  prompt: prompts/author.md
  # render_document is the deliverable, and read_artifact expands a spilled
  # upstream result. Research is NOT this skill's job: `ensure_authoring_research`
  # guarantees a retriever plus researcher fan-out runs BEFORE author, and their
  # findings are handed in. Measured over 1,910 recorded tool uses:
  #
  #     author  render_document 185   web_search 31   everything else 0
  #     deck    render_document  42   web_search  5   everything else 0
  #
  # So fetch_url, search_knowledge, recall_preferences, arxiv_search,
  # wikipedia_search and news_search were carried on EVERY call and called
  # NEVER - about 500 tokens of schema per call, re-sent on each of the ~4
  # hops a single document takes. web_search is kept deliberately: it is the
  # only thing that stops a document being written from nothing when the
  # upstream researchers failed or were skipped, and it was used 31 times.
  # Everything else is gone.
  tools_allowed: [render_document, read_artifact, web_search]
  temperature: 0.35        # structure must be exact; prose can breathe
  # A whole document's worth of blocks. The default 2048 truncated the
  # `blocks` array mid-document, which the renderer then renders as a
  # half-empty file rather than failing loudly.
  # Raised to the provider ceiling: a 12-page document is ~5,400 words, and
  # every block carries JSON escaping overhead on top of the prose. 16000
  # tokens ran out mid-`blocks`, which renders as a document that stops
  # halfway rather than one that fails loudly. Same reasoning as the
  # researcher: this is a ceiling, not a target, and cost scales with what is
  # actually written.
  max_tokens: 65536
  description: |
    Writes a document (PDF, Word, or Excel) from a request and renders it as a
    real file: reports, briefs, summaries, comparisons, spreadsheets. Use
    whenever the user wants an artifact they can open, print or edit — not
    for a question that a chat answer satisfies.

deck:
  prompt: prompts/deck.md
  # Same reasoning as author, and the measurement agrees: deck called
  # render_document 42 times and web_search 5, and nothing else at all. The
  # fetch_url / search_knowledge / recall_preferences it carried were never
  # called once.
  tools_allowed: [render_document, read_artifact, web_search]
  temperature: 0.4         # slide phrasing wants a little range
  # Raised to the provider ceiling, same reasoning as author: a deck's
  # `blocks` carry the same JSON overhead as a document's.
  max_tokens: 65536
  description: |
    Builds a PowerPoint presentation: one idea per slide, short bullets,
    tables for comparisons. Use for "make a deck", "slides for", "present
    this to the team".

formatter:
  prompt: prompts/formatter.md
  # THE FINAL ANSWER. This was 1500 tokens (~1,100 words), so a research
  # report could never exceed a single page no matter what the prompt
  # asked for — the answer was truncated mid-sentence by the API, not
  # kept short by the model. Deep/broad research writes several pages.
  # Raised to the provider ceiling: with the researcher's own cap lifted,
  # a summariser that re-emits the same text becomes the new bottleneck.
  max_tokens: 65536
  # One focused call per upstream result, then assemble (see
  # skills._sectioned_final_answer). The keyed models answer a single
  # "write the report" request with ~300 words no matter how high the
  # cap, so length has to come from splitting the work.
  sectioned: true
  description: Renders the final answer for the user. Conventional terminal node — its output.final_answer is what the executor returns.

sandbox_executor:
  prompt: prompts/sandbox_executor.md
  temperature: 0.0
  # Raised from 400. 400 tokens truncated stdout capture metadata and any
  # explanation of a failure to stderr, so a crashed run reported only a code.
  max_tokens: 4000
  description: Runs code from a Coder node in the sandbox and returns stdout, stderr, exit code, and any generated files.

coder:
  prompt: prompts/coder.md
  # The sandbox file tools had NO skill wired to them (present in the MCP
  # server + catalog, callable by nothing). The coder writes code FOR the
  # sandbox, so it reads/greps first, then emits.
  #
  # run_checks / git_inspect / find_symbol are what turn this from "writes a
  # file" into a coding agent: without them `create_file` returned ok:true for
  # code that does not compile and the node reported success.
  tools_allowed: [read_file, list_dir, search_files, find_symbol,
                  document_symbols, find_references, blast_radius,
                  preview_edit, apply_symbol_edit,
                  create_file, update_file, edit_file, delete_file,
                  run_checks, git_inspect, index_document]
  internal_successors: [sandbox_executor]
  temperature: 0.2
  # Was 1500. A real file edit - a new endpoint with types, error handling and
  # tests - is several thousand tokens, so the node was truncated mid-function
  # and the tail was lost silently. Raised to the provider ceiling, same as
  # every other content-producing skill.
  max_tokens: 65536
  description: Implements changes against the real project - reads it first, edits it, then runs the project's own checks and fixes what fails.

browser:
  prompt: prompts/browser.md
  # The Browser skill does not go through the standard LLM-call dispatch.
  # It owns its own cascade (HTML extract → a11y text → vision SoM) and
  # routes each layer's gateway call internally. temperature / max_tokens
  # are kept here for registry uniformity but the dispatcher ignores them.
  temperature: 0.0
  max_tokens: 1024
  description: |
    Fetches and interacts with web pages through a four-layer cascade
    (extract, deterministic, a11y, vision). Inputs in metadata: url
    (required) and goal (required). Returns BrowserOutput with the
    chosen layer surfaced as output.path. Use when Researcher's
    fetch_url is insufficient: JavaScript-rendered content, interactive
    widgets, multi-page workflows.

# Session 9 — general-assistant integration skill. The "action" node is the
# agent's hands: it can call the real-world integration tools (Telegram,
# email, Google Calendar) plus the existing web/file tools. The
# Planner routes any "do something" request here. It is NOT a terminal node
# by itself — pair it with a formatter so the user gets a confirmation.
action:
  prompt: prompts/action.md
  tools_allowed: [send_telegram, send_email, gmail_refresh_token, create_calendar_event, calendar_refresh_token,
                  calendar_query, gmail_query, github_query, slack_message, slack_refresh_token, slack_history,
                  discord_message, notion_query,
                  web_search, fetch_url,
                  schedule_task, list_scheduled, cancel_scheduled, enable_scheduled,
                  # The action prompt tells the model to call list_channels()
                  # and check_channel() before picking a delivery target. It
                  # could not: neither was in this list, so the instruction
                  # was a description of a capability the node did not have.
                  list_channels, check_channel, save_as_document]
  temperature: 0.2
  max_tokens: 1500
  description: |
    Executes real-world actions on the user's behalf: send a Telegram
    message, send an email, or create a Google Calendar event.
    Also has web + time + currency tools for context.
    Returns a structured confirmation of what was done. Pair with a
    formatter node to render the result to the user.

# Session 9 — local-image understanding. Sends a file already on disk
# (screenshot, photo, scan) to the V9 vision model. No browser, no fetch.
vision_file:
  prompt: prompts/vision_file.md
  temperature: 0.2
  max_tokens: 1200
  description: |
    Describes or answers questions about a LOCAL image file via the V9
    vision model. Inputs in metadata: path (required local image path)
    and goal (optional question). Use for "what's in this screenshot?",
    "read the text in this image", "describe my photo".

# Session 9 — gated computer-use. Lets the agent act on the user's own
# machine (run a command, read/write a file, open an app). Ships DISABLED
# and in DRY-RUN mode; the user opts in via COMPUTER_USE_ENABLED and
# sensitive actions always require in-UI approval. Pair with a formatter.
computer:
  prompt: prompts/computer.md
  tools_allowed: [computer_action]
  temperature: 0.1
  max_tokens: 1200
  description: |
    Requests a gated action on the user's local machine via the
    computer_action tool (run_command / read_file / write_file /
    open_app). Computer-use is OFF unless the host set
    COMPUTER_USE_ENABLED=true; in dry-run mode it only describes what it
    would do. Sensitive commands return status 'pending' and wait for the
    user to approve in the UI. Use only when the user explicitly asks the
    agent to operate their computer.
