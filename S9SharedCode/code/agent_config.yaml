# Session 9 skills catalogue (grown from the Session 8 set).
#
# Each entry below names one skill (the node "type" the orchestrator can
# run). The two files that define a skill are this yaml entry and the
# referenced `prompt:` markdown — there is no Python class per skill.
#
# Fields:
#   prompt              path to the system prompt, relative to S9SharedCode/code/
#   description         one-line summary (shown in dashboards / replay)
#   provider_pin        OPTIONAL preferred provider; overridden by
#                       agent_routing.yaml in the gateway if set there.
#                       Most pins live in the gateway side, not here.
#   tools_allowed       which MCP tools this skill may call. Empty list
#                       means the skill is text-only and never calls a
#                       tool through the gateway's tool-use channel.
#   internal_successors STATIC graph extension. Whenever this skill
#                       finishes, the orchestrator adds these skills as
#                       successor nodes regardless of what the skill
#                       itself emitted in AgentResult.successors. Used
#                       by Coder → SandboxExecutor.
#   critic              When true, the orchestrator inserts a Critic
#                       node on every outgoing edge from this skill.
#                       Used by Distiller.
#
# Anything declared under `metadata:` is opaque to the orchestrator; the
# skill is free to interpret its own metadata however it wants.

planner:
  prompt: prompts/planner.md
  tools_allowed: []
  temperature: 0.4         # decompositions need a little breathing room
  max_tokens: 1500
  description: Decomposes user queries into the initial DAG and synthesises recovery subgraphs on node failure.

retriever:
  prompt: prompts/retriever.md
  # recall_preferences to answer "how do I like things?" (a standing
  # preference must beat a lexical match on topic words), and
  # remember_preference because a correction often arrives mid-retrieval
  # ("no, I always want the publication date") and that turn is the only
  # place it was said out loud.
  tools_allowed: [search_knowledge, recall_preferences, remember_preference]
  temperature: 0.2         # retrieval is mostly deterministic
  max_tokens: 1200
  description: Searches Memory and the FAISS index for material relevant to a query.

researcher:
  prompt: prompts/researcher.md
  # remember_preference: a research run is where "always give me the
  # publication date" and "no paywalled sources" get said out loud. Without a
  # write path here, preferences said during research were lost.
  tools_allowed: [web_search, fetch_url, arxiv_search, wikipedia_search,
                  openalex_search, news_search, fetch_pdf, extract_tables,
                  wayback_fetch, remember_preference, recall_preferences]
  temperature: 0.7         # exploratory; let the model choose phrasings
  max_tokens: 2500
  description: Performs multi-step web research and produces normalised text outputs.

distiller:
  prompt: prompts/distiller.md
  critic: true
  temperature: 0.1         # extraction; almost-zero
  max_tokens: 1200
  description: Extracts structured fields from raw text or page content.

summariser:
  prompt: prompts/summariser.md
  temperature: 0.3
  max_tokens: 1200
  description: Condenses long content into a short form.

critic:
  prompt: prompts/critic.md
  temperature: 0.0         # pass/fail; we want determinism
  max_tokens: 500
  description: Evaluates an upstream node's output; emits pass or fail with rationale.

formatter:
  prompt: prompts/formatter.md
  temperature: 0.3
  max_tokens: 1500
  description: Renders the final answer for the user. Conventional terminal node — its output.final_answer is what the executor returns.

sandbox_executor:
  prompt: prompts/sandbox_executor.md
  temperature: 0.0
  max_tokens: 400
  description: Runs code from a Coder node in the sandbox and returns stdout, stderr, exit code, and any generated files.

coder:
  prompt: prompts/coder.md
  # The sandbox file tools had NO skill wired to them (present in the MCP
  # server + catalog, callable by nothing). The coder writes code FOR the
  # sandbox, so it reads/greps first, then emits.
  tools_allowed: [read_file, list_dir, search_files, create_file,
                  update_file, edit_file, delete_file, index_document]
  internal_successors: [sandbox_executor]
  temperature: 0.2
  max_tokens: 1500
  description: Emits Python code for a task; the orchestrator hands it to sandbox_executor next.

browser:
  prompt: prompts/browser.md
  # The Browser skill does not go through the standard LLM-call dispatch.
  # It owns its own cascade (HTML extract → a11y text → vision SoM) and
  # routes each layer's gateway call internally. temperature / max_tokens
  # are kept here for registry uniformity but the dispatcher ignores them.
  temperature: 0.0
  max_tokens: 1024
  description: |
    Fetches and interacts with web pages through a four-layer cascade
    (extract, deterministic, a11y, vision). Inputs in metadata: url
    (required) and goal (required). Returns BrowserOutput with the
    chosen layer surfaced as output.path. Use when Researcher's
    fetch_url is insufficient: JavaScript-rendered content, interactive
    widgets, multi-page workflows.

# Session 9 — general-assistant integration skill. The "action" node is the
# agent's hands: it can call the real-world integration tools (Telegram,
# email, Google Calendar) plus the existing web/file tools. The
# Planner routes any "do something" request here. It is NOT a terminal node
# by itself — pair it with a formatter so the user gets a confirmation.
action:
  prompt: prompts/action.md
  tools_allowed: [send_telegram, send_email, gmail_refresh_token, create_calendar_event, calendar_refresh_token,
                  calendar_query, gmail_query, github_query, slack_message, slack_refresh_token, slack_history,
                  discord_message, notion_query,
                  web_search, fetch_url,
                  schedule_task, list_scheduled, cancel_scheduled]
  temperature: 0.2
  max_tokens: 1500
  description: |
    Executes real-world actions on the user's behalf: send a Telegram
    message, send an email, or create a Google Calendar event.
    Also has web + time + currency tools for context.
    Returns a structured confirmation of what was done. Pair with a
    formatter node to render the result to the user.

# Session 9 — local-image understanding. Sends a file already on disk
# (screenshot, photo, scan) to the V9 vision model. No browser, no fetch.
vision_file:
  prompt: prompts/vision_file.md
  temperature: 0.2
  max_tokens: 1200
  description: |
    Describes or answers questions about a LOCAL image file via the V9
    vision model. Inputs in metadata: path (required local image path)
    and goal (optional question). Use for "what's in this screenshot?",
    "read the text in this image", "describe my photo".

# Session 9 — gated computer-use. Lets the agent act on the user's own
# machine (run a command, read/write a file, open an app). Ships DISABLED
# and in DRY-RUN mode; the user opts in via COMPUTER_USE_ENABLED and
# sensitive actions always require in-UI approval. Pair with a formatter.
computer:
  prompt: prompts/computer.md
  tools_allowed: [computer_action]
  temperature: 0.1
  max_tokens: 1200
  description: |
    Requests a gated action on the user's local machine via the
    computer_action tool (run_command / read_file / write_file /
    open_app). Computer-use is OFF unless the host set
    COMPUTER_USE_ENABLED=true; in dry-run mode it only describes what it
    would do. Sensitive commands return status 'pending' and wait for the
    user to approve in the UI. Use only when the user explicitly asks the
    agent to operate their computer.
